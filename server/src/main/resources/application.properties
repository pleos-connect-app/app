spring.application.name=server

# TourAPI 인증키: 환경변수 TOUR_API_KEY 또는 application-local.yml(tour-api.service-key)로 넣는다. 여기에 직접 쓰지 말 것.
tour-api.service-key=${TOUR_API_KEY:}

# 공유 링크(QR) 공개 주소. 휴대폰에서 열리는 주소여야 한다(README "공유 링크 주소" 참고).
share.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# VWorld(공간정보 오픈플랫폼) 인증키: 리캡 영상의 위성 지도 배경, 출발지 동네 이름. 없으면 단색 배경·이름 없이 만든다.
# 환경변수 VWORLD_API_KEY 또는 application-local.yml(vworld.api-key)로 넣는다. 여기에 직접 쓰지 말 것.
vworld.api-key=${VWORLD_API_KEY:}

# 리캡 영상(F-07)·썸네일 파일 저장 폴더, ffmpeg 실행 파일(PATH에 없으면 전체 경로). ffmpeg가 없으면 썸네일만 만든다.
recap.storage-dir=${RECAP_STORAGE_DIR:data/recaps}
recap.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
