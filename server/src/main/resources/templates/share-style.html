<!-- 공유 페이지 공통 스타일 조각. share.html, share-unavailable.html에서 th:replace로 넣는다. -->
<style th:fragment="style">
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1b1b1f;
    --muted: #6b6b73;
    --line: #e4e2dc;
    --accent: #1f5eff;
    --accent-text: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --surface: #1c1c21;
      --text: #f2f2f4;
      --muted: #a0a0aa;
      --line: #2c2c33;
      --accent: #6d95ff;
      --accent-text: #0b0b0e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap--center { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .photo { margin: 0 0 20px; border-radius: 16px; overflow: hidden; background: var(--surface); }
  .photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  /* 공공누리 3유형(변경 금지): 잘라내지 않고 원본 비율 그대로 */
  .photo--original img { aspect-ratio: auto; object-fit: contain; height: auto; }
  .photo figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
  .eyebrow { margin: 0; font-size: 14px; color: var(--muted); }
  h1 { margin: 4px 0 4px; font-size: 26px; line-height: 1.3; letter-spacing: -0.01em; word-break: keep-all; }
  .address { margin: 0; color: var(--muted); font-size: 15px; word-break: keep-all; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0;
  }
  .stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stats dt { font-size: 12px; color: var(--muted); }
  .stats dd { margin: 2px 0 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .video { margin: 0 0 16px; display: grid; gap: 8px; }
  .video video { width: 100%; aspect-ratio: 9 / 16; max-height: 70vh; background: #000; border-radius: 16px; }
  .video--pending {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
  }
  .video--pending p { margin: 0; }
  .button {
    display: block;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    line-height: 52px;
    cursor: pointer;
  }
  .button--ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .toast { min-height: 1.5em; margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--muted); word-break: break-all; }
  .foot { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
